<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Bar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <Header class="header">
        <div class="container">
            <div class="row header-line">
                <div class="col-3 image-size">
                    <img src="./asset/img/logo-light.svg" alt="">
                </div>
                <div class="col-6 Home-menu">
                    <ul class="d-flex flex-row justify-content-center clam-center gap-5">
                        <li>Home</li>
                        <li>Companies</li>
                        <li>About</li>
                        <li>Pricing</li>
                        <li>Blog</li>
                        <li>Contact</li>
                    </ul>
                </div>
                <div class="col-3 d-flex flex-row justify-content-end align-items-center">
                    <i class="bi bi-sun sunlight"></i>
                    <button class="btn btn-primary">Post a Jop</button>
                </div>
            </div>
        </div>
    </Header>
    <div class="banner d-flex flex-column justify-content-center align-items-center">
        <button class="head-button">2500</button>
        <h1 class="text-center text-size">Find Your Dream Job</h1>
        <p class="text-center text-para">Search thousands of opportunities from top companies worldwide. <br>Your next
            career move starts here.</p>
        <div class="head-back">
            <form class="d-flex search-line" role="search">
                <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
                <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
                <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
                <input class="btn btn-primary" type="button" value="Search Jops">
            </form>

            <hr class="line-border">

            <div class="badge d-flex flex-column justify-content-center align-items-center">
                <span class="dot">Advanced Filters</span>
            </div>

        </div>



    </div>




</body>

</html>
